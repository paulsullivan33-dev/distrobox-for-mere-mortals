site_name: Distrobox for Mere Mortals
site_description: Use any Linux distribution inside your terminal. Creating boxes that share your home folder, running one distribution's software on another, exporting apps to your desktop, and knowing exactly where a box's walls are — because some of them are not where you would guess.
